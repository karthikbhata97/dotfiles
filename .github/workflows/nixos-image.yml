# Builds a Proxmox template image of a ./nixos host and publishes it as the
# asset of the `image-<host>` release, so the Proxmox node can just wget it.
name: nixos-image

on:
  workflow_dispatch:
    inputs:
      host:
        description: Host in nixos/flake.nix to build
        default: baremin
  push:
    branches: [master]
    paths: ["nixos/**", ".github/workflows/nixos-image.yml"]

permissions:
  contents: write

concurrency:
  group: nixos-image-${{ inputs.host || 'baremin' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HOST: ${{ inputs.host || 'baremin' }}
    steps:
      - uses: actions/checkout@v4

      # The runner has ~14G free; the disk image is assembled in the store.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # make-disk-image builds the image inside a VM and requires `kvm`.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Build image
        run: nix build "./nixos#nixosConfigurations.$HOST.config.system.build.VMA" -o result -L

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="image-$HOST"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "Proxmox image: $HOST" --notes "Built from nixos/ by .github/workflows/nixos-image.yml."
          gh release upload "$tag" result/*.vma.zst --clobber
          gh release edit "$tag" --notes "Built from ${GITHUB_SHA::12} on $(date -u +%F)."
